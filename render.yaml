# โฮสต์ฟรีบน Render: ใช้ Turso (ฐานข้อมูล) + Groq (ถอดเสียง) ไฟล์สินค้าอยู่ในโค้ดเลย (ไม่ต้องใช้ Supabase)
# Render → New → Blueprint → เลือกรีโพนี้ แล้วกรอกค่าที่ขึ้นว่า sync: false (ดู docs/ย้ายขึ้น-Netlify.md ขั้นที่ 7)
services:
  - type: web
    name: aksornwai
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
      - key: RENDER_MODE
        value: browser
      - key: DOWNLOAD_LINK_SECRET
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - { key: BASE_URL, sync: false }
      - { key: ADMIN_EMAIL, sync: false }
      - { key: ADMIN_PASSWORD, sync: false }
      # เข้าสู่ระบบด้วย Clerk (ปุ่ม Google) · ไม่ตั้ง = ใช้อีเมล+รหัสผ่านแบบเดิม (ดู docs/ตั้งค่า-Clerk.md)
      - { key: CLERK_PUBLISHABLE_KEY, sync: false }
      - { key: CLERK_SECRET_KEY, sync: false }
      - { key: DATABASE_URL, sync: false }
      - { key: DATABASE_AUTH_TOKEN, sync: false }
      - { key: GROQ_API_KEY, sync: false }
      - { key: PAYMENT_PROVIDER, value: manual }
      # อีเมล: MAIL_MODE=brevo + BREVO_API_KEY (API key ขึ้นต้น xkeysib- ไม่ใช่ SMTP key) + MAIL_FROM (ผู้ส่งที่ยืนยันใน Brevo)
      # ไม่ล็อกค่าไว้ในไฟล์นี้ เพื่อไม่ให้ Blueprint sync เขียนทับค่าที่ตั้งใน Render
      - { key: MAIL_MODE, sync: false }
      - { key: BREVO_API_KEY, sync: false }
      - { key: MAIL_FROM, sync: false }
      - { key: SHOP_NOTIFY_EMAIL, sync: false } # อีเมลร้านรับแจ้ง "ลูกค้ายืนยันโอน" (ว่าง = ADMIN_EMAIL)
      - { key: PROMPTPAY_ID, sync: false }
      - { key: PROMPTPAY_NAME, sync: false }
      - { key: LEGAL_NAME, sync: false }
      - { key: CONTACT_EMAIL, sync: false }
